{% extends "academia/base.html" %}

{% block contenido %}
<div class="tarjeta">
  <h1>Bienvenido a Mi Academia</h1>
  <p>Sistema de gestión académica para administrar cursos y alumnos.</p>
  <p><strong>{{ total_cursos }}</strong> cursos · <strong>{{ total_alumnos }}</strong> alumnos registrados.</p>

  </div>
</div>
{% endblock %}
